# GitHub Actions: Windows版・macOS版の自動ビルドワークフロー
name: Build Windows & macOS Apps

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt PyAudioWPatch pyinstaller
      - name: Windows版をビルド
        run: |
          pyinstaller --noconfirm --clean --windowed --name "LectureTranscriber" --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --hidden-import pyaudiowpatch main.py
      - name: アーティファクトをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: LectureTranscriber-Windows
          path: dist/LectureTranscriber

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: macOS版 (.app & .dmg) をビルド
        run: |
          pyinstaller --noconfirm --clean LectureTranscriber_mac.spec
          codesign --force --deep --sign - "dist/LectureTranscriber.app" || true
          mkdir -p dist/dmg_stage
          cp -R dist/LectureTranscriber.app dist/dmg_stage/
          ln -s /Applications dist/dmg_stage/Applications
          hdiutil create -volname "Lecture Transcriber" -srcfolder dist/dmg_stage -ov -format UDZO "dist/LectureTranscriber-macOS.dmg"
      - name: アーティファクトをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: LectureTranscriber-macOS-DMG
          path: dist/LectureTranscriber-macOS.dmg
